<style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .shadow-level-1 {
            box-shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .shadow-level-2 {
            box-shadow: 0px 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .btn-primary-shadow {
            box-shadow: 0 2px 0 0 #004395; /* on-primary-fixed-variant approx */
        }
        
        /* Suppressing side nav and top nav for focus mode as per Shell Visibility rules for Linear/Transactional/Task-focused screens */
    </style>

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Top Focus Header -->
<header class="w-full flex items-center justify-between px-lg py-md border-b border-surface-variant bg-surface-white shrink-0 shadow-sm z-10">
<div class="flex items-center gap-4">
<button aria-label="Close session" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary">LinguistPro</div>
</div>
<div class="flex-1 max-w-xl mx-8 hidden md:block">
<div class="flex items-center justify-between mb-2">
<span class="font-label-md text-label-md text-on-surface-variant">Daily Goal: 20 words</span>
<span class="font-label-md text-label-md font-bold text-primary">5 / 20</span>
</div>
<div class="h-[8px] w-full bg-[#E2E8F0] rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 25%"></div>
</div>
</div>
<div class="flex items-center gap-sm">
<div class="flex flex-col items-end mr-4">
<span class="font-label-md text-label-md text-on-surface-variant">Score</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">1,250</span>
</div>
<button aria-label="Settings" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Mobile Progress (visible only on small screens) -->
<div class="w-full px-4 py-3 bg-surface-white md:hidden border-b border-surface-variant">
<div class="flex items-center justify-between mb-1">
<span class="font-label-md text-label-md text-on-surface-variant">Progress</span>
<span class="font-label-md text-label-md font-bold text-primary">5 / 20</span>
</div>
<div class="h-[8px] w-full bg-[#E2E8F0] rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 25%"></div>
</div>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center p-md sm:p-lg w-full max-w-container-max mx-auto relative overflow-hidden">
<!-- Flashcard Container -->
<div class="relative w-full max-w-2xl aspect-[4/3] sm:aspect-video perspective-1000 z-10">
<!-- The Card -->
<div class="w-full h-full relative transition-transform duration-500 transform-style-3d cursor-pointer shadow-level-1 hover:shadow-level-2 rounded-[16px] bg-surface-white" id="flashcard" onclick="flipCard()">
<!-- Front (Side A) -->
<div class="absolute inset-0 backface-hidden w-full h-full flex flex-col items-center justify-center p-8 bg-surface-white rounded-[16px]">
<div class="flex flex-col items-center justify-center flex-1 space-y-4">
<h2 class="font-display-lg text-display-lg text-on-surface font-bold text-center">Ubiquitous</h2>
<div class="flex items-center gap-3">
<span class="font-ipa-display text-ipa-display text-text-muted">/juːˈbɪk.wɪ.təs/</span>
<button aria-label="Play audio" class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-low text-primary hover:bg-primary-container/20 transition-colors" onclick="event.stopPropagation()">
<span class="material-symbols-outlined text-[18px]" data-icon="volume_up" data-weight="fill" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
</div>
<div class="w-full pt-4 border-t border-[#E2E8F0] flex justify-center">
<span class="font-label-md text-label-md text-on-surface-variant">Tap to show meaning</span>
</div>
</div>
<!-- Back (Side B) -->
<div class="absolute inset-0 backface-hidden rotate-y-180 w-full h-full flex flex-col p-6 sm:p-8 bg-surface-white rounded-[16px]">
<div class="flex-1 flex flex-col sm:flex-row gap-6">
<div class="flex-1 flex flex-col justify-center space-y-4">
<div>
<h3 class="font-label-md text-label-md text-primary uppercase tracking-wider mb-1">Vietnamese Meaning</h3>
<p class="font-headline-md text-headline-md text-on-surface font-semibold">Có mặt ở khắp nơi</p>
</div>
<div class="bg-surface-container-low p-4 rounded-lg">
<p class="font-body-lg text-body-lg text-on-surface-variant italic">"Smartphones have become <strong class="text-primary font-semibold">ubiquitous</strong> in modern society."</p>
</div>
<div class="flex items-center gap-2">
<span class="px-2 py-1 bg-surface-variant text-on-surface-variant rounded font-label-md text-label-md text-[12px]">Adjective</span>
<span class="px-2 py-1 bg-surface-variant text-on-surface-variant rounded font-label-md text-label-md text-[12px]">Formal</span>
</div>
</div>
<div class="hidden sm:block w-1/3 h-full rounded-lg overflow-hidden relative bg-surface-container-high">
<!-- Optional Image for context -->
<div class="bg-cover bg-center w-full h-full absolute inset-0" data-alt="A bright, modern flat vector illustration of people in a busy city park, all holding smartphones. High key lighting, minimalist shapes, corporate clean aesthetic, primarily blue and white with subtle green accents. Communicates being everywhere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB-ey8nT3dXi3RSGRQHXfG9XEnvcJU18yoPc25dlr3Ayj9ZZz3FvgwfDolRchLDLYZnlrtwcrkQ0d_tNySDn4hF-pg_Lg2IGlfPlnm8FzkH5IJq50aqPB1uyIiz2-RGRV4Mvng6o5JEd11eAq9njGigkGI6-_ANIGBsU0kxsMvGvlm-ZJOGQfm_iMrY68bN7Ah2E3ZzpFxhO3NJVXS9H6yjbYuJZSUpPJUaEo13l4sg5ivmMtEqfRdI')"></div>
</div>
</div>
<div class="w-full pt-4 mt-4 border-t border-[#E2E8F0] flex justify-center">
<span class="font-label-md text-label-md text-on-surface-variant">How well did you know this?</span>
</div>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="w-full max-w-2xl mt-8 flex flex-col items-center gap-4 z-10">
<!-- Initial state: Show Answer -->
<div class="w-full flex justify-center" id="action-show">
<button class="bg-primary text-on-primary font-label-md text-label-md py-4 px-12 rounded-[12px] btn-primary-shadow hover:bg-surface-tint transition-all active:translate-y-[2px] active:shadow-none w-full sm:w-auto" onclick="flipCard()">
                    Show Answer
                </button>
</div>
<!-- Result state: Hard / Good / Easy -->
<div class="w-full flex gap-4 hidden" id="action-rate">
<button class="flex-1 bg-error-container text-on-error-container font-label-md text-label-md py-4 rounded-[12px] shadow-sm hover:bg-[#ffcdc9] transition-all" onclick="nextCard()">
<div class="flex flex-col items-center">
<span class="mb-1">Hard</span>
<span class="text-[12px] opacity-80">&lt; 1m</span>
</div>
</button>
<button class="flex-1 bg-surface-container-high text-on-surface font-label-md text-label-md py-4 rounded-[12px] shadow-sm border border-outline-variant hover:bg-surface-variant transition-all" onclick="nextCard()">
<div class="flex flex-col items-center">
<span class="mb-1">Good</span>
<span class="text-[12px] opacity-80">10m</span>
</div>
</button>
<button class="flex-1 bg-secondary text-on-secondary font-label-md text-label-md py-4 rounded-[12px] shadow-sm hover:bg-[#00714d] transition-all" onclick="nextCard()">
<div class="flex flex-col items-center">
<span class="mb-1">Easy</span>
<span class="text-[12px] opacity-80">4d</span>
</div>
</button>
</div>
</div>
</main>
<script>
        let isFlipped = false;
        
        function flipCard() {
            const card = document.getElementById('flashcard');
            const actionShow = document.getElementById('action-show');
            const actionRate = document.getElementById('action-rate');
            
            if (!isFlipped) {
                card.classList.add('rotate-y-180');
                isFlipped = true;
                
                // Toggle action buttons
                setTimeout(() => {
                    actionShow.classList.add('hidden');
                    actionRate.classList.remove('hidden');
                }, 150); // wait halfway through animation
            }
        }
        
        function nextCard() {
            const card = document.getElementById('flashcard');
            const actionShow = document.getElementById('action-show');
            const actionRate = document.getElementById('action-rate');
            
            // Minimal animation to simulate next card
            card.style.transform = 'translateX(-150%)';
            card.style.opacity = '0';
            
            setTimeout(() => {
                // Reset states
                card.classList.remove('rotate-y-180');
                isFlipped = false;
                actionRate.classList.add('hidden');
                actionShow.classList.remove('hidden');
                
                // Bring back
                card.style.transition = 'none';
                card.style.transform = 'translateX(150%)';
                
                setTimeout(() => {
                    card.style.transition = 'transform 0.5s, opacity 0.5s';
                    card.style.transform = 'translateX(0)';
                    card.style.opacity = '1';
                }, 50);
            }, 300);
        }
    </script>
</body></html>
