<body class="bg-surface h-full flex items-center justify-center p-md md:p-lg antialiased">

<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Let's continue your journey.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-md relative z-10" method="POST">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-sm py-sm bg-surface-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-sm py-sm bg-surface-white border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm rounded-lg shadow-sm border-b-[3px] border-brand-navy hover:bg-primary-container active:border-b-0 active:translate-y-[3px] transition-all duration-150 flex items-center justify-center gap-xs mt-lg" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg flex items-center gap-sm relative z-10">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant">Or continue with</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
